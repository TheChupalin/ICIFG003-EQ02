<div class="login-container d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-panel row g-0 shadow-lg rounded-4 overflow-hidden">
    <div class="col-lg-6 login-visual d-none d-lg-flex flex-column justify-content-center p-4 text-white">
      <div>
        <h2>Bienvenido</h2>
        <p>Ingresa para administrar personas y familias con rapidez y seguridad.</p>
      </div>
    </div>
    <div class="col-lg-6 p-5 bg-white">
      <h3 class="mb-4">@if (isRegisterMode) { Crear Cuenta } @else { Iniciar Sesion }</h3>
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password" required>
        </div>
        @if (isRegisterMode) {
          <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
            <input id="confirmPassword" type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
          </div>
        }
        @if (errorMessage) {
          <div class="alert alert-danger">{{ errorMessage }}</div>
        }
        <button type="submit" class="btn btn-primary w-100">
          @if (isRegisterMode) { Crear cuenta } @else { Ingresar }
        </button>
      </form>
      <div class="text-center text-muted mt-4">
        @if (isRegisterMode) {
          ¿Ya tienes cuenta?
          <button type="button" class="btn btn-link p-0" (click)="toggleMode()">Inicia sesion</button>
        } @else {
          ¿No tienes cuenta?
          <button type="button" class="btn btn-link p-0" (click)="toggleMode()">Crea una aqui</button>
        }
      </div>
    </div>
  </div>
</div>
